      `);
    }

    function topUpChildBalance(childId, amount) {
      const child = getChildById(childId);
      if (!child || !amount) return;
      child.balance = (Number(child.balance) || 0) + Number(amount);
      appData.topUps.push({
        id: 'tu_' + Date.now(),
        childId,
        amount: Number(amount),
        date: toIsoDateStr(new Date())
      });
      saveAppData();
      showToast(`Баланс пополнен на ${formatRub(amount)}`, 'success');
      openChildDetailModal(childId);
      if (uiState.activeTab === 'children') renderChildrenTab();
    }

    function topUpCustomAmount(childId) {
      const inp = document.getElementById('custom-topup-input');
      const val = inp ? Number(inp.value) : 0;
      if (val > 0) {
        topUpChildBalance(childId, val);
      } else {
        showToast('Введите корректную сумму', 'warning');
      }
    }

    function openChildFormModal(childId = null) {
      const child = childId ? getChildById(childId) : null;
      const isEdit = Boolean(child);
      const selectedColor = child ? child.color : AVATAR_COLORS[appData.children.length % AVATAR_COLORS.length];

      openModal(`
        <div class="px-4 py-3.5 bg-white border-b border-black/5 flex items-center justify-between shrink-0">
          <button onclick="closeModal()" class="text-[15px] text-[#007AFF] font-medium">Отмена</button>
          <h3 class="text-[16px] font-bold text-black">${isEdit ? 'Редактировать ребенка' : 'Новый ребенок'}</h3>
          <button onclick="saveChildForm('${child ? child.id : ''}')" class="text-[15px] text-[#007AFF] font-bold">Сохранить</button>
        </div>
        <div class="p-4 overflow-y-auto space-y-4">
          <div class="ios-card p-4 space-y-3">
            <div>
              <label class="text-[12px] font-semibold text-[#8E8E93] block mb-1">Имя и фамилия ребенка *</label>
              <input id="cf-name" type="text" value="${child ? escapeHtml(child.name) : ''}" placeholder="Например: Артем Соколов" class="w-full bg-[#F2F2F7] px-3.5 py-2.5 rounded-xl text-[14px] focus:outline-none" />
            </div>
            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="text-[12px] font-semibold text-[#8E8E93] block mb-1">Возраст</label>
                <input id="cf-age" type="text" value="${child ? escapeHtml(child.age || '') : ''}" placeholder="5 лет" class="w-full bg-[#F2F2F7] px-3.5 py-2.5 rounded-xl text-[14px] focus:outline-none" />
              </div>
              <div>
                <label class="text-[12px] font-semibold text-[#8E8E93] block mb-1">Баланс (₽)</label>
                <input id="cf-balance" type="number" step="100" value="${child ? Number(child.balance) : 0}" class="w-full bg-[#F2F2F7] px-3.5 py-2.5 rounded-xl text-[14px] font-bold focus:outline-none" />
              </div>
            </div>
            <div>
              <label class="text-[12px] font-semibold text-[#8E8E93] block mb-1">Родитель (ФИО)</label>
              <input id="cf-parent" type="text" value="${child ? escapeHtml(child.parentName || '') : ''}" placeholder="Елена Соколова" class="w-full bg-[#F2F2F7] px-3.5 py-2.5 rounded-xl text-[14px] focus:outline-none" />
            </div>
            <div>
              <label class="text-[12px] font-semibold text-[#8E8E93] block mb-1">Телефон родителя</label>
              <input id="cf-phone" type="tel" value="${child ? escapeHtml(child.parentPhone || '') : ''}" placeholder="+7 (999) 123-45-67" class="w-full bg-[#F2F2F7] px-3.5 py-2.5 rounded-xl text-[14px] focus:outline-none" />
            </div>
            <div>
              <label class="text-[12px] font-semibold text-[#8E8E93] block mb-1">Комментарий / особенности</label>
              <textarea id="cf-notes" rows="2" placeholder="Пожелания, особенности..." class="w-full bg-[#F2F2F7] px-3.5 py-2 rounded-xl text-[14px] focus:outline-none">${child ? escapeHtml(child.notes || '') : ''}</textarea>
            </div>
            <div>
              <label class="text-[12px] font-semibold text-[#8E8E93] block mb-1.5">Цвет карточки</label>
              <div class="flex gap-2" id="cf-colors">
                ${AVATAR_COLORS.map(c => `
                  <button type="button" onclick="selectFormColor('cf-colors', '${c}')" data-color="${c}" class="w-8 h-8 rounded-full ${c} ${c === selectedColor ? 'ring-2 ring-offset-2 ring-black' : ''}"></button>
                `).join('')}
              </div>
              <input type="hidden" id="cf-color-val" value="${selectedColor}" />
            </div>
          </div>
        </div>
      `);
    }

    function saveChildForm(childId) {
      const name = document.getElementById('cf-name').value.trim();
      if (!name) {
        showToast('Введите имя ребенка', 'warning');
        return;
      }
      const age = document.getElementById('cf-age').value.trim();
      const balance = Number(document.getElementById('cf-balance').value) || 0;
      const parentName = document.getElementById('cf-parent').value.trim();
      const parentPhone = document.getElementById('cf-phone').value.trim();
      const notes = document.getElementById('cf-notes').value.trim();
      const color = document.getElementById('cf-color-val').value || 'bg-emerald-600';

      if (childId) {
        const existing = getChildById(childId);
        if (existing) {
          existing.name = name;
          existing.age = age;
          existing.balance = balance;
          existing.parentName = parentName;
          existing.parentPhone = parentPhone;
          existing.notes = notes;
          existing.color = color;
        }
        showToast('Карточка ребенка обновлена', 'success');
      } else {
        appData.children.push({
          id: 'c_' + Date.now(),
          name,
          age,
          balance,
          parentName,
          parentPhone,
          notes,
          color
        });
        showToast('Ребенок добавлен', 'success');
      }

      saveAppData();
      closeModal();
      switchTab(uiState.activeTab);
    }

    function deleteChild(childId) {
      appData.children = appData.children.filter(c => c.id !== childId);
      appData.lessons.forEach(l => {
        l.enrollments = l.enrollments.filter(e => e.childId !== childId);
      });
      saveAppData();
      closeModal();
      switchTab('children');
      showToast('Карточка ребенка удалена', 'info');
    }

    // --- 9.3. Модальное окно Занятия ---
    function toggleLessonRepeatType() {
      const type = document.getElementById('lf-repeat-type').value;
      const dayWrap = document.getElementById('lf-day-wrap');
      const dateWrap = document.getElementById('lf-date-wrap');
      if (dayWrap && dateWrap) {
        dayWrap.classList.toggle('hidden', type === 'once');
        dateWrap.classList.toggle('hidden', type !== 'once');
      }
    }

    function openLessonFormModal(lessonId = null) {
      const lesson = lessonId ? appData.lessons.find(l => l.id === lessonId) : null;
      const isEdit = Boolean(lesson);

      const selectedDateObj = parseIsoDate(uiState.selectedDate);
      const defaultDay = lesson ? lesson.day : getDayKeyFromDate(selectedDateObj);
      const isOnce = Boolean(lesson && lesson.specificDate);
      const defaultSpecificDate = (lesson && lesson.specificDate) ? lesson.specificDate : uiState.selectedDate;
      const defaultTeacherId = lesson ? lesson.teacherId : (appData.teachers[0] ? appData.teachers[0].id : '');
      const defaultSubject = lesson ? lesson.subject : (appData.subjects[0] || 'Логопед');
      const enrolledIds = lesson ? lesson.enrollments.map(e => e.childId) : [];

      openModal(`
        <div class="px-4 py-3.5 bg-white border-b border-black/5 flex items-center justify-between shrink-0">
          <button onclick="closeModal()" class="text-[15px] text-[#007AFF] font-medium">Отмена</button>
          <h3 class="text-[16px] font-bold text-black">${isEdit ? 'Редактировать занятие' : 'Новое занятие'}</h3>
          <button onclick="saveLessonForm('${lesson ? lesson.id : ''}')" class="text-[15px] text-[#007AFF] font-bold">Сохранить</button>
        </div>
        <div class="p-4 overflow-y-auto space-y-4">
          <div class="ios-card p-4 space-y-3">
            <div>
              <label class="text-[12px] font-semibold text-[#8E8E93] block mb-1">Периодичность в календаре</label>
              <select id="lf-repeat-type" onchange="toggleLessonRepeatType()" class="w-full bg-[#F2F2F7] px-3 py-2.5 rounded-xl text-[14px] font-semibold focus:outline-none">
                <option value="weekly" ${!isOnce ? 'selected' : ''}>Еженедельно по расписанию</option>
                <option value="once" ${isOnce ? 'selected' : ''}>Разовое занятие на конкретную дату</option>
              </select>
            </div>

            <div class="grid grid-cols-3 gap-2">
              <div id="lf-day-wrap" class="${isOnce ? 'hidden' : ''}">
                <label class="text-[12px] font-semibold text-[#8E8E93] block mb-1">День недели</label>
                <select id="lf-day" class="w-full bg-[#F2F2F7] px-2.5 py-2.5 rounded-xl text-[14px] font-semibold focus:outline-none">
                  ${DAYS.map(d => `<option value="${d.key}" ${d.key === defaultDay ? 'selected' : ''}>${d.key} (${d.full})</option>`).join('')}
                </select>
              </div>
              <div id="lf-date-wrap" class="${!isOnce ? 'hidden' : ''}">
                <label class="text-[12px] font-semibold text-[#8E8E93] block mb-1">Дата</label>
                <input id="lf-specific-date" type="date" value="${defaultSpecificDate}" class="w-full bg-[#F2F2F7] px-2 py-2.5 rounded-xl text-[13px] font-semibold focus:outline-none" />
              </div>
              <div>
                <label class="text-[12px] font-semibold text-[#8E8E93] block mb-1">Начало</label>
                <input id="lf-start" type="time" value="${lesson ? lesson.startTime : '10:00'}" class="w-full bg-[#F2F2F7] px-2.5 py-2.5 rounded-xl text-[14px] font-semibold focus:outline-none" />
              </div>
              <div>
                <label class="text-[12px] font-semibold text-[#8E8E93] block mb-1">Конец</label>
                <input id="lf-end" type="time" value="${lesson ? lesson.endTime : '10:45'}" class="w-full bg-[#F2F2F7] px-2.5 py-2.5 rounded-xl text-[14px] font-semibold focus:outline-none" />
              </div>
            </div>

            <div>
              <label class="text-[12px] font-semibold text-[#8E8E93] block mb-1">Направление</label>
              <select id="lf-subject" class="w-full bg-[#F2F2F7] px-3 py-2.5 rounded-xl text-[14px] font-semibold focus:outline-none">
                ${appData.subjects.map(s => `<option value="${escapeHtml(s)}" ${s === defaultSubject ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}
              </select>
            </div>

            <div>
              <label class="text-[12px] font-semibold text-[#8E8E93] block mb-1">Преподаватель *</label>
              ${appData.teachers.length === 0
                ? `<p class="text-[12px] text-rose-600 bg-rose-50 p-2.5 rounded-xl">Сначала добавьте хотя бы одного преподавателя во вкладке «Педагоги».</p>`
                : `
                  <select id="lf-teacher" class="w-full bg-[#F2F2F7] px-3 py-2.5 rounded-xl text-[14px] font-semibold focus:outline-none">
                    ${appData.teachers.map(t => `<option value="${t.id}" ${t.id === defaultTeacherId ? 'selected' : ''}>${escapeHtml(t.name)}</option>`).join('')}
                  </select>
                `
              }
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="text-[12px] font-semibold text-[#8E8E93] block mb-1">Кабинет / формат</label>
                <input id="lf-room" type="text" value="${lesson ? escapeHtml(lesson.room || '') : ''}" placeholder="Каб. 1 / Инд." class="w-full bg-[#F2F2F7] px-3 py-2.5 rounded-xl text-[14px] focus:outline-none" />
              </div>
              <div>
                <label class="text-[12px] font-semibold text-[#8E8E93] block mb-1">Своя цена (₽, опц.)</label>
                <input id="lf-custom-price" type="number" min="0" step="50" value="${lesson && lesson.customPrice !== null && lesson.customPrice !== undefined ? lesson.customPrice : ''}" placeholder="По тарифу" class="w-full bg-[#F2F2F7] px-3 py-2.5 rounded-xl text-[14px] focus:outline-none" />
              </div>
            </div>
          </div>

          <div class="ios-card p-4 space-y-2.5">
            <h4 class="text-[15px] font-bold text-black">Записанные дети</h4>
            ${appData.children.length === 0
              ? `<p class="text-[12px] text-[#8E8E93]">Список детей пуст. Добавьте детей во вкладке «Дети».</p>`
              : `<div class="space-y-2 max-h-48 overflow-y-auto">
                  ${appData.children.map(c => {
                    const checked = enrolledIds.includes(c.id);
                    return `
                      <label class="flex items-center justify-between bg-[#F2F2F7] px-3 py-2 rounded-xl cursor-pointer">
                        <span class="text-[14px] font-medium text-black">${escapeHtml(c.name)}</span>
                        <input type="checkbox" value="${c.id}" ${checked ? 'checked' : ''} class="lf-child-cb w-5 h-5 accent-[#007AFF] rounded" />
                      </label>
                    `;
                  }).join('')}
                </div>`
            }
          </div>

          ${isEdit ? `
            <button onclick="deleteLesson('${lesson.id}')" class="ios-press w-full bg-rose-50 text-rose-600 font-semibold text-[14px] py-3 rounded-xl">
              Удалить занятие
            </button>
          ` : ''}
        </div>
      `);
    }

    function saveLessonForm(lessonId) {
      const repeatType = document.getElementById('lf-repeat-type').value;
      const specificDate = repeatType === 'once' ? document.getElementById('lf-specific-date').value : null;
      const day = specificDate ? getDayKeyFromDate(parseIsoDate(specificDate)) : document.getElementById('lf-day').value;
      const startTime = document.getElementById('lf-start').value || '10:00';
      const endTime = document.getElementById('lf-end').value || '10:45';
      const subject = document.getElementById('lf-subject').value;
      const teacherEl = document.getElementById('lf-teacher');
      const teacherId = teacherEl ? teacherEl.value : '';
      const room = document.getElementById('lf-room').value.trim();
      const customRaw = document.getElementById('lf-custom-price').value.trim();
      const customPrice = customRaw === '' ? null : Number(customRaw);

      if (!teacherId) {
        showToast('Выберите преподавателя для занятия', 'warning');
        return;
      }

      const selectedChildIds = Array.from(document.querySelectorAll('.lf-child-cb:checked')).map(cb => cb.value);

      if (lessonId) {
        const existing = appData.lessons.find(l => l.id === lessonId);
        if (existing) {
          const newEnrollments = selectedChildIds.map(cid => {
            const prev = existing.enrollments.find(e => e.childId === cid);
            return prev ? prev : { childId: cid };
          });

          existing.day = day;
          existing.specificDate = specificDate;
          existing.startTime = startTime;
          existing.endTime = endTime;
          existing.subject = subject;
          existing.teacherId = teacherId;
          existing.room = room;
          existing.customPrice = customPrice;
          existing.enrollments = newEnrollments;
        }
        showToast('Занятие обновлено', 'success');
      } else {
        appData.lessons.push({
          id: 'l_' + Date.now(),
          day,
          specificDate,
          startTime,
          endTime,
          subject,
          teacherId,
          room,
          customPrice,
          enrollments: selectedChildIds.map(cid => ({ childId: cid }))
        });
        if (specificDate) {
          selectCalendarDate(specificDate);
        }
        showToast('Занятие добавлено в календарь', 'success');
      }

      saveAppData();
      closeModal();
      switchTab('schedule');
    }

    function deleteLesson(lessonId) {
      appData.lessons = appData.lessons.filter(l => l.id !== lessonId);
      saveAppData();
      closeModal();
      switchTab('schedule');
      showToast('Занятие удалено', 'info');
    }

    // =========================================================================
    // 10. ЭКСПОРТ, ИМПОРТ И ПОЛНАЯ ОЧИСТКА БАЗЫ ДАННЫХ
    // =========================================================================
    function exportDatabaseJson() {
      try {
        const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `tigrum_center_backup_${toIsoDateStr(new Date())}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Резервная копия JSON скачана', 'success');
      } catch (e) {
        showToast('Не удалось экспортировать базу', 'error');
      }
    }

    function importDatabaseJson(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || !Array.isArray(parsed.teachers) || !Array.isArray(parsed.children) || !Array.isArray(parsed.lessons)) {
            throw new Error('Неверный формат файла');
          }
          appData = {
            subjects: Array.isArray(parsed.subjects) && parsed.subjects.length ? parsed.subjects : [...DEFAULT_SUBJECTS],
            teachers: parsed.teachers,
            children: parsed.children,
            lessons: parsed.lessons,
            attendanceLog: parsed.attendanceLog && typeof parsed.attendanceLog === 'object' ? parsed.attendanceLog : {},
            topUps: Array.isArray(parsed.topUps) ? parsed.topUps : []
          };
          saveAppData();
          switchTab(uiState.activeTab);
          showToast('База успешно импортирована', 'success');
        } catch (err) {
          showToast('Ошибка чтения JSON файла', 'error');
        }
      };
      reader.readAsText(file);
    }

    function openResetConfirmModal() {
      openModal(`
        <div class="p-5 space-y-4 text-center">
          <div class="w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto font-bold text-xl">!</div>
          <div>
            <h3 class="text-[17px] font-bold text-black">Очистить все данные?</h3>
            <p class="text-[13px] text-[#8E8E93] mt-1">
              Все педагоги, карточки детей, расписание и история посещений Детского развивающего центра «Тигрум» будут безвозвратно удалены.
            </p>
          </div>
          <div class="grid grid-cols-2 gap-2.5 pt-1">
            <button onclick="closeModal()" class="ios-press bg-[#E5E5EA] text-black font-semibold text-[14px] py-3 rounded-xl">Отмена</button>
            <button onclick="confirmFullReset()" class="ios-press bg-rose-600 text-white font-semibold text-[14px] py-3 rounded-xl">Очистить всё</button>
          </div>
        </div>
      `);
    }

    function confirmFullReset() {
      appData = getEmptyStateData();
      saveAppData();
      closeModal();
      switchTab('schedule');
      showToast('База данных полностью очищена', 'info');
    }

    // =========================================================================
    // 11. ИНИЦИАЛИЗАЦИЯ ПРИЛОЖЕНИЯ
    // =========================================================================
    function updateStatusClock() {
      const clockEl = document.getElementById('ios-clock');
      if (!clockEl) return;
      const now = new Date();
      clockEl.textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    window.onload = function() {
      initBrandBranding();
      updateStatusClock();
      setInterval(updateStatusClock, 30000);
      switchTab('schedule');
      renderLockScreen();
    };

    // Автоматическая блокировка при сворачивании приложения на iPhone или переключении вкладки
    document.addEventListener('visibilitychange', function() {
      if (document.hidden && getAuthConfig()) {
        lockAppNow();
      }
    });
  </script>
</body>
</html>
